name: Validate token list

on:
  pull_request:
    paths:
      - "tokenlist.json"
      - "tokenlist.schema.json"
      - "scripts/validate_tokenlist.py"
      - ".github/workflows/validate-tokenlist.yml"
  push:
    branches:
      - main
    paths:
      - "tokenlist.json"
      - "tokenlist.schema.json"
      - "scripts/validate_tokenlist.py"
      - ".github/workflows/validate-tokenlist.yml"

jobs:
  validate:
    name: Validate tokenlist.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate tokenlist.json
        run: python scripts/validate_tokenlist.py
